# Bypass Next.js: its server-side API requests have the server's IP.
location = /api/visitors/track {
    limit_req zone=visitor_tracking burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 2k;
    proxy_pass http://backend-origin:8000/visitors/track;
}
# Allow a 5 MiB image plus multipart form overhead. The app enforces file size.
location ~ ^/api/(blog|project)-images$ {
    client_max_body_size 6m;
    proxy_pass http://frontend:3000;
}
location / {
    proxy_pass http://frontend:3000;
}
