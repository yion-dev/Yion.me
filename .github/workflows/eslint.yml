name: Next.js ESLint Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  eslint:
    name: Run ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Sets up the virtual runner environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json' # Essential for Monorepos

      # Steps into your frontend directory to install packages cleanly
      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      # Runs the native 'next lint' command inside your frontend folder
      - name: Run Next.js Lint
        working-directory: ./frontend
        run: npm run lint