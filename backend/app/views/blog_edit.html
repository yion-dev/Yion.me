<style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0
    }

    :root {
        --bg: #1a1a1a;
        --surface: #222;
        --border: #333;
        --text: #e8e8e8;
        --muted: #666;
        --accent: #e8e8e8;
    }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px
    }

    .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 2rem 1.5rem 4rem
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 1.5rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--border)
    }

    h1 {
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.02em
    }

    .hint {
        color: var(--muted);
        font-size: 11px
    }

    .field {
        margin-bottom: 1.25rem
    }

    .field-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        margin-bottom: 1.25rem
    }

    label {
        display: block;
        color: var(--muted);
        font-size: 11px;
        margin-bottom: 5px
    }

    label span {
        color: var(--text)
    }

    input[type=text],
    textarea {
        width: 100%;
        background: transparent;
        border: none;
        border-bottom: 1px solid var(--border);
        color: var(--text);
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        padding: 7px 0;
        outline: none;
        transition: border-color 0.15s;
        resize: none;
        border-radius: 0
    }

    input[type=text]:focus,
    textarea:focus {
        border-bottom-color: var(--text)
    }

    input[type=text]::placeholder,
    textarea::placeholder {
        color: #444
    }

    .char-hint {
        font-size: 10px;
        color: var(--muted);
        margin-top: 3px;
        text-align: right
    }

    .toolbar {
        display: flex;
        gap: 6px;
        margin-bottom: 6px
    }

    .tb-btn {
        background: none;
        border: 1px solid var(--border);
        color: var(--muted);
        cursor: pointer;
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        padding: 2px 7px;
        transition: all 0.1s
    }

    .tb-btn:hover {
        border-color: var(--text);
        color: var(--text)
    }

    textarea#desc {
        min-height: 200px;
        font-size: 12px;
        line-height: 1.8
    }

    .divider {
        height: 1px;
        background: var(--border);
        margin: 1.5rem 0
    }

    .meta {
        display: flex;
        gap: 2rem;
        color: var(--muted);
        font-size: 11px;
        padding: 0.75rem 0
    }

    .meta span {
        color: #444
    }

    .actions {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-top: 1.5rem
    }

    .btn-primary {
        background: var(--text);
        color: #1a1a1a;
        border: none;
        cursor: pointer;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        font-weight: 500;
        padding: 9px 20px;
        transition: opacity 0.15s
    }

    .btn-primary:hover {
        opacity: 0.85
    }

    .btn-ghost {
        background: none;
        border: 1px solid var(--border);
        color: var(--muted);
        cursor: pointer;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        padding: 9px 16px;
        transition: all 0.15s
    }

    .btn-ghost:hover {
        border-color: var(--text);
        color: var(--text)
    }

    .status {
        color: var(--muted);
        font-size: 11px;
        margin-left: auto
    }

    .status.ready {
        color: var(--text)
    }

    .toast {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        padding: 10px 14px;
        opacity: 0;
        transform: translateY(6px);
        transition: all 0.2s;
        pointer-events: none
    }

    .toast.show {
        opacity: 1;
        transform: translateY(0)
    }
</style>

<div class="wrap">
    <h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Create a new
        blog post</h2>

    <div class="header">
        <h1>&gt; blogs / create</h1>
        <span class="hint">POST /blogs/create</span>
    </div>

    <div class="field-row">
        <div class="field" style="margin-bottom:0">
            <label>[ blog_title ] <span>*</span></label>
            <input type="text" id="title" placeholder="enter title..." maxlength="255"
                oninput="updateChar('title','tc',255);updateStatus()">
            <div class="char-hint"><span id="tc">0</span>/255</div>
        </div>
        <div class="field" style="margin-bottom:0">
            <label>[ blog_author ] <span>*</span></label>
            <input type="text" id="author" placeholder="enter author..." oninput="updateStatus()">
        </div>
    </div>

    <div class="field">
        <label>[ blog_smallDescription ] <span>*</span></label>
        <input type="text" id="summary" placeholder="one line summary..." maxlength="255"
            oninput="updateChar('summary','sc',255);updateStatus()">
        <div class="char-hint"><span id="sc">0</span>/255</div>
    </div>

    <div class="field">
        <label>[ blog_description ] <span>*</span></label>
        <div class="toolbar">
            <button class="tb-btn" onclick="wrap('**','**')">**b**</button>
            <button class="tb-btn" onclick="wrap('*','*')">*i*</button>
            <button class="tb-btn" onclick="wrap('`','`')">`code`</button>
            <button class="tb-btn" onclick="insertPrefix('## ')"># h2</button>
            <button class="tb-btn" onclick="insertPrefix('- ')">- list</button>
            <button class="tb-btn" onclick="insertPrefix('> ')">&gt; quote</button>
        </div>
        <textarea id="desc" placeholder="write content here..." oninput="updateStatus()"></textarea>
    </div>

    <div class="divider"></div>

    <div class="meta">
        <span>[ blog_id ] <span>auto_increment</span></span>
        <span>[ blog_createdAt ] <span>server_default</span></span>
        <span>[ blog_updatedAt ] <span>on_update</span></span>
    </div>

    <div class="divider"></div>

    <div class="actions">
        <button class="btn-ghost" onclick="clearForm()">[ clear ]</button>
        <button class="btn-primary" onclick="submitForm()">[ publish ] →</button>
        <span class="status" id="status">// draft</span>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    function updateChar(inputId, countId, max) {
        const len = document.getElementById(inputId).value.length;
        const el = document.getElementById(countId);
        el.textContent = len;
        el.style.color = len > max * 0.9 ? '#e8e8e8' : '';
    }
    function updateStatus() {
        const t = document.getElementById('title').value.trim();
        const a = document.getElementById('author').value.trim();
        const d = document.getElementById('desc').value.trim();
        const s = document.getElementById('status');
        if (t && a && d) { s.textContent = '// ready'; s.classList.add('ready'); }
        else { s.textContent = '// draft'; s.classList.remove('ready'); }
    }
    function wrap(before, after) {
        const ta = document.getElementById('desc');
        const s = ta.selectionStart, e = ta.selectionEnd;
        const sel = ta.value.substring(s, e);
        ta.value = ta.value.substring(0, s) + before + sel + after + ta.value.substring(e);
        ta.focus(); ta.setSelectionRange(s + before.length, e + before.length);
        updateStatus();
    }
    function insertPrefix(prefix) {
        const ta = document.getElementById('desc');
        const s = ta.selectionStart;
        const lineStart = ta.value.lastIndexOf('\n', s - 1) + 1;
        ta.value = ta.value.substring(0, lineStart) + prefix + ta.value.substring(lineStart);
        ta.focus(); updateStatus();
    }
    function clearForm() {
        ['title', 'author', 'summary', 'desc'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('tc').textContent = '0';
        document.getElementById('sc').textContent = '0';
        updateStatus();
    }
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2800);
    }
    async function submitForm() {
        const title = document.getElementById('title').value.trim();
        const author = document.getElementById('author').value.trim();
        const summary = document.getElementById('summary').value.trim();
        const desc = document.getElementById('desc').value.trim();

        if (!title || !author || !summary || !desc) {
            showToast('// error: fill all required fields');
            return;
        }

        const payload = {
            blog_title: title,
            blog_smallDescription: summary,
            blog_description: desc,
            blog_author: author
        };

        try {
            const res = await fetch('/blogs/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                showToast('// post published');
                clearForm();
            } else {
                showToast('// error: ' + res.status);
            }
        } catch (e) {
            showToast('// error: request failed');
        }
    }
</script>
