<style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0
    }

    :root {
        --bg: #1a1a1a;
        --surface: #222;
        --border: #333;
        --text: #e8e8e8;
        --muted: #666;
        --dim: #444
    }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px
    }

    .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 2rem 1.5rem 4rem
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 1.5rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--border)
    }

    h1 {
        font-size: 14px;
        font-weight: 500
    }

    .hint {
        color: var(--muted);
        font-size: 11px
    }

    .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 1.25rem;
        flex-wrap: wrap
    }

    input[type=text] {
        background: transparent;
        border: none;
        border-bottom: 1px solid var(--border);
        color: var(--text);
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        padding: 6px 0;
        outline: none;
        width: 260px;
        transition: border-color 0.15s
    }

    input[type=text]:focus {
        border-bottom-color: var(--text)
    }

    input[type=text]::placeholder {
        color: var(--dim)
    }

    .btn {
        background: none;
        border: 1px solid var(--border);
        color: var(--muted);
        cursor: pointer;
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        padding: 5px 12px;
        transition: all 0.1s
    }

    .btn:hover {
        border-color: var(--text);
        color: var(--text)
    }

    .btn.primary {
        background: var(--text);
        color: #1a1a1a;
        border-color: var(--text)
    }

    .btn.primary:hover {
        opacity: 0.85
    }

    .btn.danger {
        border-color: #553333;
        color: #884444
    }

    .btn.danger:hover {
        border-color: #cc4444;
        color: #cc4444
    }

    .count {
        color: var(--muted);
        font-size: 11px;
        margin-left: auto
    }

    .blog-list {
        display: flex;
        flex-direction: column
    }

    .blog-row {
        border-bottom: 1px solid var(--border);
        padding: 1rem 0;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: start
    }

    .blog-row:first-child {
        border-top: 1px solid var(--border)
    }

    .blog-id {
        color: var(--dim);
        font-size: 11px;
        margin-bottom: 4px
    }

    .blog-title {
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 4px;
        cursor: pointer;
        transition: color 0.1s;
        text-decoration: none;
        color: var(--text);
        display: block
    }

    .blog-title:hover {
        color: var(--muted)
    }

    .blog-desc {
        color: var(--muted);
        font-size: 11px;
        line-height: 1.6;
        margin-bottom: 6px
    }

    .blog-meta {
        color: var(--dim);
        font-size: 10px;
        display: flex;
        gap: 12px
    }

    .row-actions {
        display: flex;
        gap: 6px;
        align-items: flex-start;
        padding-top: 2px
    }

    .empty {
        color: var(--muted);
        font-size: 12px;
        padding: 2rem 0;
        text-align: center
    }

    .loading {
        color: var(--muted);
        font-size: 12px;
        padding: 2rem 0;
        text-align: center
    }

    .page {
        display: none
    }

    .page.active {
        display: block
    }

    .back-btn {
        background: none;
        border: none;
        color: var(--muted);
        cursor: pointer;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        padding: 0;
        transition: color 0.1s;
        margin-bottom: 1.5rem;
        display: block
    }

    .back-btn:hover {
        color: var(--text)
    }

    .post-title {
        font-size: 18px;
        font-weight: 500;
        margin-bottom: 0.75rem;
        line-height: 1.4
    }

    .post-meta {
        color: var(--muted);
        font-size: 11px;
        display: flex;
        gap: 16px;
        margin-bottom: 1.25rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--border)
    }

    .post-summary {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.7;
        margin-bottom: 1.5rem;
        padding: 0.75rem;
        border-left: 2px solid var(--border)
    }

    .post-body {
        font-size: 13px;
        line-height: 1.9;
        color: #ccc;
        white-space: pre-wrap
    }

    .post-actions {
        display: flex;
        gap: 8px;
        margin-top: 2rem;
        padding-top: 1rem;
        border-top: 1px solid var(--border)
    }

    .modal-bg {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        z-index: 100;
        align-items: center;
        justify-content: center
    }

    .modal-bg.open {
        display: flex
    }

    .modal {
        background: #1e1e1e;
        border: 1px solid var(--border);
        padding: 1.5rem;
        width: 100%;
        max-width: 560px;
        margin: 1rem
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 1.25rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid var(--border)
    }

    .modal h2 {
        font-size: 13px;
        font-weight: 500
    }

    .field {
        margin-bottom: 1.1rem
    }

    label {
        display: block;
        color: var(--muted);
        font-size: 10px;
        margin-bottom: 4px
    }

    .modal input[type=text],
    .modal textarea {
        width: 100%;
        background: transparent;
        border: none;
        border-bottom: 1px solid var(--border);
        color: var(--text);
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        padding: 6px 0;
        outline: none;
        resize: none;
        transition: border-color 0.15s;
        border-radius: 0
    }

    .modal input[type=text]:focus,
    .modal textarea:focus {
        border-bottom-color: var(--text)
    }

    .modal input[type=text]::placeholder,
    .modal textarea::placeholder {
        color: var(--dim)
    }

    .modal textarea {
        min-height: 120px;
        line-height: 1.7
    }

    .modal-actions {
        display: flex;
        gap: 8px;
        margin-top: 1.25rem;
        padding-top: 1rem;
        border-top: 1px solid var(--border)
    }

    .confirm-bg {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        z-index: 200;
        align-items: center;
        justify-content: center
    }

    .confirm-bg.open {
        display: flex
    }

    .confirm {
        background: #1e1e1e;
        border: 1px solid #553333;
        padding: 1.25rem;
        max-width: 360px;
        width: 100%;
        margin: 1rem
    }

    .confirm p {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.7;
        margin-bottom: 1rem
    }

    .confirm strong {
        color: var(--text)
    }

    .toast {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        padding: 10px 14px;
        opacity: 0;
        transform: translateY(6px);
        transition: all 0.2s;
        pointer-events: none;
        z-index: 300
    }

    .toast.show {
        opacity: 1;
        transform: translateY(0)
    }
</style>

<div class="wrap">
    <h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Blog
        management</h2>

    <!-- LIST PAGE -->
    <div class="page active" id="page-list">
        <div class="header">
            <h1>&gt; blogs / all</h1>
            <span class="hint">GET /blogs/get-all</span>
        </div>
        <div class="toolbar">
            <input type="text" id="search" placeholder="search title or author..." oninput="filterBlogs()">
            <button class="btn primary" onclick="openCreate()">[ + new post ]</button>
            <span class="count" id="count"></span>
        </div>
        <div class="blog-list" id="blog-list">
            <div class="loading">// fetching posts...</div>
        </div>
    </div>

    <!-- DETAIL PAGE -->
    <div class="page" id="page-detail">
        <div class="header">
            <h1>&gt; blogs / <span id="detail-id-label">1</span></h1>
            <span class="hint">GET /blogs/get-one/<span id="detail-hint-id">1</span></span>
        </div>
        <button class="back-btn" onclick="goList()">← back to all posts</button>
        <div id="detail-loading" class="loading">// fetching post...</div>
        <div id="detail-content" style="display:none">
            <div class="post-title" id="detail-title"></div>
            <div class="post-meta">
                <span>author: <span id="detail-author"></span></span>
                <span>created: <span id="detail-created"></span></span>
                <span>updated: <span id="detail-updated"></span></span>
            </div>
            <div class="post-summary" id="detail-summary"></div>
            <div class="post-body" id="detail-body"></div>
            <div class="post-actions">
                <button class="btn" onclick="openEditFromDetail()">[ edit ]</button>
                <button class="btn danger" onclick="openConfirmFromDetail()">[ delete ]</button>
            </div>
        </div>
    </div>
</div>

<!-- EDIT / CREATE MODAL -->
<div class="modal-bg" id="edit-modal">
    <div class="modal">
        <div class="modal-header">
            <h2 id="modal-title">&gt; blogs / update</h2>
            <span class="hint" id="modal-hint"></span>
        </div>
        <input type="hidden" id="edit-id">
        <div class="field"><label>[ blog_title ]</label><input type="text" id="edit-title" placeholder="title..."
                maxlength="255"></div>
        <div class="field"><label>[ blog_author ]</label><input type="text" id="edit-author" placeholder="author...">
        </div>
        <div class="field"><label>[ blog_smallDescription ]</label><input type="text" id="edit-summary"
                placeholder="summary..." maxlength="255"></div>
        <div class="field"><label>[ blog_description ]</label><textarea id="edit-desc"
                placeholder="content..."></textarea></div>
        <div class="modal-actions">
            <button class="btn" onclick="closeEdit()">[ cancel ]</button>
            <button class="btn primary" onclick="saveEdit()" id="save-btn">[ save ] →</button>
        </div>
    </div>
</div>

<!-- DELETE CONFIRM -->
<div class="confirm-bg" id="confirm-modal">
    <div class="confirm">
        <div class="modal-header" style="border-bottom-color:#553333">
            <h2 style="color:#cc4444">&gt; confirm delete</h2>
        </div>
        <p>delete <strong id="confirm-title"></strong>?<br>this action cannot be undone.</p>
        <div style="display:flex;gap:8px">
            <button class="btn" onclick="closeConfirm()">[ cancel ]</button>
            <button class="btn danger" onclick="confirmDelete()">[ delete ] →</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    let blogs = [];
    let deleteTarget = null;
    let currentPost = null;
    let isCreate = false;

    function fmtDate(iso) { return new Date(iso).toISOString().split('T')[0]; }
    function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2800); }

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    async function loadBlogs() {
        try {
            const res = await fetch('/blogs/get-all');
            blogs = await res.json();
        } catch (e) {
            blogs = [];
            showToast('// error: could not fetch posts');
        }
        renderBlogs(blogs);
    }

    function renderBlogs(list) {
        const el = document.getElementById('blog-list');
        document.getElementById('count').textContent = '// ' + list.length + ' post' + (list.length !== 1 ? 's' : '');
        if (!list.length) { el.innerHTML = '<div class="empty">// no posts found</div>'; return; }
        el.innerHTML = list.map(b => `
    <div class="blog-row">
      <div>
        <div class="blog-id">[ id: ${b.blog_id} ]</div>
        <a class="blog-title" onclick="goDetail(${b.blog_id})">${b.blog_title}</a>
        <div class="blog-desc">${b.blog_smallDescription}</div>
        <div class="blog-meta">
          <span>author: ${b.blog_author}</span>
          <span>created: ${fmtDate(b.blog_createdAt)}</span>
          <span>updated: ${fmtDate(b.blog_updatedAt)}</span>
        </div>
      </div>
      <div class="row-actions">
        <button class="btn" onclick="openEdit(${b.blog_id})">[ edit ]</button>
        <button class="btn danger" onclick="openConfirm(${b.blog_id})">[ del ]</button>
      </div>
    </div>
  `).join('');
    }

    function filterBlogs() {
        const q = document.getElementById('search').value.toLowerCase();
        renderBlogs(q ? blogs.filter(b => b.blog_title.toLowerCase().includes(q) || b.blog_author.toLowerCase().includes(q)) : blogs);
    }

    async function goDetail(id) {
        showPage('page-detail');
        document.getElementById('detail-id-label').textContent = id;
        document.getElementById('detail-hint-id').textContent = id;
        document.getElementById('detail-loading').style.display = 'block';
        document.getElementById('detail-content').style.display = 'none';
        try {
            const res = await fetch('/blogs/get-one/' + id);
            const b = await res.json();
            currentPost = b;
            document.getElementById('detail-title').textContent = b.blog_title;
            document.getElementById('detail-author').textContent = b.blog_author;
            document.getElementById('detail-created').textContent = fmtDate(b.blog_createdAt);
            document.getElementById('detail-updated').textContent = fmtDate(b.blog_updatedAt);
            document.getElementById('detail-summary').textContent = b.blog_smallDescription;
            document.getElementById('detail-body').textContent = b.blog_description;
            document.getElementById('detail-loading').style.display = 'none';
            document.getElementById('detail-content').style.display = 'block';
        } catch (e) {
            showToast('// error: could not fetch post');
        }
    }

    function goList() {
        showPage('page-list');
        currentPost = null;
    }

    function openCreate() {
        isCreate = true;
        document.getElementById('modal-title').textContent = '> blogs / create';
        document.getElementById('modal-hint').textContent = 'POST /blogs/create';
        document.getElementById('save-btn').textContent = '[ publish ] →';
        ['edit-id', 'edit-title', 'edit-author', 'edit-summary', 'edit-desc'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('edit-modal').classList.add('open');
    }

    function openEdit(id) {
        isCreate = false;
        const b = blogs.find(x => x.blog_id === id);
        if (!b) return;
        document.getElementById('modal-title').textContent = '> blogs / update';
        document.getElementById('modal-hint').textContent = 'PUT /blogs/update/' + id;
        document.getElementById('save-btn').textContent = '[ save ] →';
        document.getElementById('edit-id').value = b.blog_id;
        document.getElementById('edit-title').value = b.blog_title;
        document.getElementById('edit-author').value = b.blog_author;
        document.getElementById('edit-summary').value = b.blog_smallDescription;
        document.getElementById('edit-desc').value = b.blog_description;
        document.getElementById('edit-modal').classList.add('open');
    }

    function openEditFromDetail() {
        if (currentPost) openEdit(currentPost.blog_id);
    }

    function closeEdit() { document.getElementById('edit-modal').classList.remove('open'); }

    async function saveEdit() {
        const id = document.getElementById('edit-id').value;
        const payload = {
            blog_title: document.getElementById('edit-title').value.trim(),
            blog_author: document.getElementById('edit-author').value.trim(),
            blog_smallDescription: document.getElementById('edit-summary').value.trim(),
            blog_description: document.getElementById('edit-desc').value.trim()
        };
        if (!payload.blog_title || !payload.blog_author || !payload.blog_smallDescription || !payload.blog_description) {
            showToast('// error: fill all fields'); return;
        }
        try {
            if (isCreate) {
                await fetch('/blogs/create', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                showToast('// post created');
            } else {
                await fetch('/blogs/update/' + id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                showToast('// post updated');
            }
            closeEdit();
            await loadBlogs();
        } catch (e) {
            showToast('// error: request failed');
        }
    }

    function openConfirm(id) {
        deleteTarget = id;
        const b = blogs.find(x => x.blog_id === id);
        document.getElementById('confirm-title').textContent = b ? '"' + b.blog_title + '"' : 'post #' + id;
        document.getElementById('confirm-modal').classList.add('open');
    }

    function openConfirmFromDetail() {
        if (currentPost) openConfirm(currentPost.blog_id);
    }

    function closeConfirm() { document.getElementById('confirm-modal').classList.remove('open'); deleteTarget = null; }

    async function confirmDelete() {
        if (!deleteTarget) return;
        try {
            await fetch('/blogs/delete/' + deleteTarget, { method: 'DELETE' });
            showToast('// post deleted');
            closeConfirm();
            if (currentPost && currentPost.blog_id === deleteTarget) goList();
            await loadBlogs();
        } catch (e) {
            showToast('// error: delete failed');
        }
    }

    loadBlogs();
</script>
