services:
  frontend:
    mem_limit: 2g

    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "3000:3000"
 
    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

  backend:

    build:
      context: ./backend
 
    ports:
      - "8000:8000"
 
    env_file:
      - .env
 
    volumes:
      - type: bind
        source: ./backend
        target: /app
 
    depends_on:
 
      db:
        condition: service_healthy

  db:
 
    image: postgres:15-alpine
 
    env_file:
      - .env
 
    ports:
      - "5433:5432"
 
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yion_user -d yion_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
