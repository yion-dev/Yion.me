events {}

http {
    server {
        listen 80;
        server_name api.yiondev.me;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name api.yiondev.me;

        ssl_certificate /etc/letsencrypt/live/api.yiondev.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.yiondev.me/privkey.pem;

        location / {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
