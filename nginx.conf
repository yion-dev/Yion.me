events {}
http {
    include /etc/nginx/snippets/cloudflare-real-ip.conf;
    limit_req_zone $binary_remote_addr zone=visitor_tracking:10m rate=30r/m;

    # Overwrite client-supplied forwarding headers at the trusted edge.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP "";

    server {
        listen 80;
        server_name api.yiondev.me;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        include /etc/nginx/snippets/api-routes.conf;
    }
    server {
        listen 80;
        server_name yiondev.me www.yiondev.me;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        include /etc/nginx/snippets/website-routes.conf;
    }
    server {
        listen 443 ssl;
        server_name api.yiondev.me;
        ssl_certificate /etc/letsencrypt/live/api.yiondev.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.yiondev.me/privkey.pem;
        include /etc/nginx/snippets/api-routes.conf;
    }
    server {
        listen 443 ssl;
        server_name yiondev.me www.yiondev.me;
        ssl_certificate /etc/letsencrypt/live/yiondev.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yiondev.me/privkey.pem;
        include /etc/nginx/snippets/website-routes.conf;
    }
}
