events {}
http {
    server {
        listen 80;
        server_name api.yiondev.me;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        server_name api.yiondev.me;
        ssl_certificate /etc/letsencrypt/live/api.yiondev.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.yiondev.me/privkey.pem;
        location / {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # --- Frontend: HTTP only for now (serves acme-challenge + proxies to frontend) ---
    server {
        listen 80;
        server_name yiondev.me www.yiondev.me;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # server {
    #     listen 443 ssl;
    #     server_name yiondev.me www.yiondev.me;
    #     ssl_certificate /etc/letsencrypt/live/yiondev.me/fullchain.pem;
