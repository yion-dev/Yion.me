services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx:/etc/nginx/snippets:ro
      - /etc/letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend
      - frontend
    networks:
      default:
      visitor_proxy:
        ipv4_address: ${NGINX_TRACKING_IP:-172.30.50.2}
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
      image: certbot/certbot
      volumes:
        - /etc/letsencrypt:/etc/letsencrypt
        - ./certbot/www:/var/www/certbot
      entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
    
    environment:
        - BASE_URL=http://backend:8000
        
    expose:
      - "3000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  backend:
    environment:
      TRUSTED_PROXY_CIDRS: ${NGINX_TRACKING_IP:-172.30.50.2}/32
    networks:
      default:
      visitor_proxy:
        ipv4_address: ${BACKEND_TRACKING_IP:-172.30.50.3}
        aliases:
          - backend-origin
    build:
      context: ./backend
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    env_file:
      - .env
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yion_user -d yion_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

# Only Nginx and FastAPI share this network. The backend trusts Nginx's exact IP.
networks:
  visitor_proxy:
    internal: true
    ipam:
      config:
        - subnet: ${VISITOR_PROXY_SUBNET:-172.30.50.0/24}
